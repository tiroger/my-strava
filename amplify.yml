# Amplify SSR build for the Next.js app.
#
# Lives in the repository rather than in Terraform: a file here takes precedence
# over the app-level spec and is reviewed alongside the code it builds. The app
# root must match var.app_root in infrastructure/terraform/modules/web.
#
# Amplify Hosting compute supports Next.js 12 through 15, which is why the app
# is pinned to 15. Upgrade only once Amplify's supported matrix includes 16.
version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install $(cat ../../.node-version)
            - nvm use $(cat ../../.node-version)
            - node --version
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            # Amplify exposes environment variables only during the build, so
            # the server runtime reads them from .env.production. These are
            # resource names and ARNs; secret values stay in Secrets Manager.
            - env | grep -E '^(APP_DATA_BUCKET|ACTIVITIES_S3_KEY|BIKES_S3_KEY|MAINTENANCE_S3_KEY|STREAMS_S3_PREFIX|STREAMS_INDEX_S3_KEY|SAVED_ROUTES_S3_KEY|SAVED_ROUTES_S3_PREFIX|SETTINGS_S3_KEY|WEB_SECRET_ARN|STRAVA_EVENTS_QUEUE_URL|STRAVA_ATHLETE_ID|STRAVA_SUBSCRIPTION_ID)=' > .env.production
            - grep -q '^APP_DATA_BUCKET=' .env.production
            - grep -q '^WEB_SECRET_ARN=' .env.production
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .npm/**/*
          - .next/cache/**/*
