name: CI

# Pushes to master and production run CI through the deploy workflows, which
# only deploy after these jobs pass.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  repository-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed secrets and generated state
        shell: bash
        run: |
          set -euo pipefail
          # One pattern per -e: an anchor inside an alternation group behaves
          # differently in BSD and GNU grep.
          if git ls-files \
            | grep -vE '(^|/)\.env\.example$' \
            | grep -E \
                -e '(^|/)\.env$' \
                -e '(^|/)\.env\.' \
                -e '\.tfstate$' \
                -e '\.tfstate\.' \
                -e '(^|/)tfplan$' \
                -e '\.tfplan$' \
                -e '\.pem$' \
                -e '\.key$' \
                -e '\.tsbuildinfo$'; then
            echo "Sensitive or generated files are tracked."
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tests/test_strava_worker.py

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - run: terraform fmt -recursive -check infrastructure/terraform
      - name: Validate every root
        run: |
          for root in bootstrap environments/dev environments/prod; do
            echo "::group::$root"
            terraform -chdir="infrastructure/terraform/$root" init -backend=false -input=false
            terraform -chdir="infrastructure/terraform/$root" validate
            echo "::endgroup::"
          done
