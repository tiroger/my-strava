name: Terraform Drift

on:
  schedule:
    - cron: "37 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  drift:
    if: ${{ vars.TERRAFORM_STATE_BUCKET != '' && vars.AWS_TERRAFORM_PLAN_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    # Drift is measured against the configuration that was applied, so the plan
    # needs the same inputs. Without alert_email it would report the confirmed
    # SNS subscription as drift on every run.
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      # Exit code 2 means drift and fails the run, which GitHub reports to the
      # repository owner. Drift is never applied automatically.
      - name: Detect drift
        working-directory: infrastructure/terraform/environments/${{ matrix.environment }}
        env:
          STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          terraform init \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=my-strava/$ENVIRONMENT/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform plan -no-color -lock=false -detailed-exitcode
