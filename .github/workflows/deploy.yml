name: Deploy

on:
  workflow_call:
    inputs:
      github_environment:
        description: GitHub environment holding the apply role and variables.
        required: true
        type: string
      terraform_environment:
        description: Directory under infrastructure/terraform/environments.
        required: true
        type: string
    secrets:
      ALERT_EMAIL:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    # Guard on a repository variable only: environment variables, such as the
    # apply role ARN, are not visible to a job-level if.
    if: ${{ vars.TERRAFORM_STATE_BUCKET != '' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      # A secret because the repository is public. Unset creates the alert
      # topic without a subscriber.
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify the environment supplies an apply role
        env:
          APPLY_ROLE_ARN: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          GITHUB_ENVIRONMENT: ${{ inputs.github_environment }}
        run: |
          if [ -z "$APPLY_ROLE_ARN" ]; then
            echo "Set AWS_TERRAFORM_APPLY_ROLE_ARN in the $GITHUB_ENVIRONMENT GitHub environment."
            exit 1
          fi
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Apply infrastructure
        id: terraform
        working-directory: infrastructure/terraform/environments/${{ inputs.terraform_environment }}
        env:
          STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          TERRAFORM_ENVIRONMENT: ${{ inputs.terraform_environment }}
        run: |
          terraform init \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=my-strava/$TERRAFORM_ENVIRONMENT/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan
          {
            echo "amplify_app_id=$(terraform output -raw amplify_app_id)"
            echo "amplify_branch=$(terraform output -raw amplify_branch_name)"
            echo "web_url=$(terraform output -raw web_url)"
          } >> "$GITHUB_OUTPUT"
      # Amplify auto-build is off, so the app ships only after CI passes and
      # with the environment Terraform just applied. Skipped until the
      # repository is connected and Terraform owns the branch.
      - name: Build and deploy the Amplify app
        if: ${{ steps.terraform.outputs.amplify_branch != '' }}
        env:
          APP_ID: ${{ steps.terraform.outputs.amplify_app_id }}
          BRANCH: ${{ steps.terraform.outputs.amplify_branch }}
        run: |
          job_id=$(aws amplify start-job \
            --app-id "$APP_ID" \
            --branch-name "$BRANCH" \
            --job-type RELEASE \
            --commit-id "$GITHUB_SHA" \
            --query jobSummary.jobId --output text)
          echo "Started Amplify job $job_id"
          for _ in $(seq 1 120); do
            status=$(aws amplify get-job --app-id "$APP_ID" --branch-name "$BRANCH" \
              --job-id "$job_id" --query job.summary.status --output text)
            case "$status" in
              SUCCEED) echo "Amplify deploy succeeded"; exit 0 ;;
              FAILED|CANCELLED) echo "Amplify job $job_id ended with $status"; exit 1 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for Amplify job $job_id"
          exit 1
      # A 503 means the runtime cannot see its configuration, which is how a
      # broken .env.production step shows up. Degraded (secrets not populated,
      # first sync pending) is reported but does not fail the deploy.
      - name: Smoke test the deployed app
        if: ${{ steps.terraform.outputs.amplify_branch != '' }}
        env:
          WEB_URL: ${{ steps.terraform.outputs.web_url }}
        run: |
          body=$(curl --silent --show-error --fail-with-body --retry 5 --retry-delay 10 \
            --retry-all-errors "$WEB_URL/api/health")
          echo "$body"
          if [ "$(echo "$body" | jq -r .status)" != "ok" ]; then
            echo "::warning::$WEB_URL is deployed but degraded: $(echo "$body" | jq -c .checks)"
          fi
          echo "Deployed $GITHUB_SHA to $WEB_URL" >> "$GITHUB_STEP_SUMMARY"
