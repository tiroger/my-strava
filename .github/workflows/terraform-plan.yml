name: Terraform Plan

on:
  pull_request:
    paths:
      - "infrastructure/terraform/**"
      - "services/strava_worker/**"
      - ".github/workflows/terraform-plan.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    # The read-only plan role trusts pull requests and the default branch, so
    # plans need no GitHub environment and never wait on production approval.
    if: ${{ vars.TERRAFORM_STATE_BUCKET != '' && vars.AWS_TERRAFORM_PLAN_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      # Same inputs the apply uses. A plan run with different inputs shows
      # changes the apply would never make, which trains reviewers to skim it.
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Plan
        working-directory: infrastructure/terraform/environments/${{ matrix.environment }}
        env:
          STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          terraform init \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=my-strava/$ENVIRONMENT/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          # The lock is skipped because a read-only plan must never block, or be
          # blocked by, a deploy that is applying at the same time.
          terraform plan -no-color -lock=false -out=tfplan
          {
            echo "### Terraform plan: $ENVIRONMENT"
            echo '```'
            terraform show -no-color tfplan | grep -E '^(Plan:|No changes)|^  # ' | head -100
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
